name: Deploy to GitHub Pages

# GitHub Pages ne sert plus le site : il **redirige** vers Vercel, où le site
# vit depuis le 28 août 2026. La raison tient en une ligne : Pages ne sait pas
# réécrire une route, si bien que `/catalogue`, `/profil` et les fiches
# répondaient `404` — visibles pour un visiteur grâce au script de repli, mais
# ignorées des moteurs de recherche.
#
# ## Revenir en arrière
#
# Les étapes de construction sont **conservées volontairement** : elles
# vérifient que le site compile toujours, et surtout elles permettent de
# reprendre l'hébergement ici en une ligne. Pour cela, remettre `path: dist` à
# la place de `path: redirection` ci-dessous, et redéployer.

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Le site est construit — donc vérifié — mais ce sont les pages de
      # redirection qui partent. Remettre `dist` ici rétablit l'hébergement.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: redirection

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
