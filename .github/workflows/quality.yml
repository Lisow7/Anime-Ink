name: Qualité et sécurité

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, tests, audit et build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
      # Le garde-fou d'accessibilité a besoin d'un vrai navigateur : sous jsdom,
      # axe ne calcule aucune mise en page et serait aveugle aux contrastes comme
      # aux tailles de cible, c'est-à-dire à ce qu'il doit justement surveiller.
      - run: npx playwright install --with-deps chromium
      - run: node scripts/a11y.mjs
