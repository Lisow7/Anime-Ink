name: Qualité et sécurité

on:
  # Les branches de travail visent `dev` : ne déclencher que sur `main` laissait
  # chaque PR de fonctionnalité passer sans aucun contrôle, et ne vérifiait le
  # lot qu'une fois déjà fusionné. Un garde-fou ne protège que ce qu'il visite.
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, tests, audit et build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
      # Mesuré juste après le build, avant d'installer un navigateur : une
      # régression de poids n'a pas besoin de Chromium pour être vue, et échouer
      # tôt économise deux minutes.
      - run: node scripts/budget.mjs
      # Le garde-fou d'accessibilité a besoin d'un vrai navigateur : sous jsdom,
      # axe ne calcule aucune mise en page et serait aveugle aux contrastes comme
      # aux tailles de cible, c'est-à-dire à ce qu'il doit justement surveiller.
      - run: npx playwright install --with-deps chromium
      - run: node scripts/a11y.mjs
      # Les parcours vérifient ce que les pages FONT, là où le garde-fou
      # d'accessibilité vérifie seulement ce qu'elles montrent. Les tests
      # unitaires ne couvrent que la couche réseau et les utilitaires : neutraliser
      # le floutage d'une carte les laisse tous verts, et fait échouer un parcours.
      - run: node scripts/parcours.mjs
